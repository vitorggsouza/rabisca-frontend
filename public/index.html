<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="O Rabisca é um aplicativo de anotações simples e intuitivo, criado para auxiliar você no seu dia a dia.">
  <meta name="author" content="Vitor Souza">
  <meta name="theme-color" content="#0378a6">
  <title>Rabisca – Suas anotações em um só lugar</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon" sizes="any">
  <link rel="icon" href="/assets/images/favicons/favicon.svg" type="image/svg+xml" sizes="any">
  <link rel="icon" href="/assets/images/favicons/favicon-16x16.png" type="image/png" sizes="16x16">
  <link rel="icon" href="/assets/images/favicons/favicon-32x32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/images/favicons/apple-touch-icon.png" type="image/png" sizes="180x180">
  <link rel="manifest" href="/site.webmanifest">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/main.min.css">
  <link rel="stylesheet" href="/assets/css/home.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
  <script src="/assets/javascript/main.min.js" defer></script>
  <script>
    const htmlElement = document.documentElement;
    const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    const savedTheme = localStorage.getItem('theme');
    const theme = savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : systemTheme;

    const openModal = (modal) => {
      const modalInstance = new bootstrap.Modal(modal);

      modalInstance.show();
    };

    const openWarningModal = (message) => {
      warningModalDescription.textContent = message;

      openModal(warningModal);
    };

    htmlElement.dataset.bsTheme = theme;

    /*
    document.addEventListener('DOMContentLoaded', () => {
      const warningModal = document.querySelector('#warningModal');
      const warningModalDescription = document.querySelector('#warningModalDescription');

      if (warningModal && warningModalDescription) {
        openWarningModal('Este é um aviso!');
      }
    });
    */
  </script>
</head>
<body class="d-flex flex-column min-vh-100">
  <header class="sticky-top bg-body-tertiary border-bottom">
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a href="/" class="navbar-brand">
          <img src="/assets/images/logo.svg" alt="Rabisca" class="img-fluid" width="30" height="24">
        </a>
        <button type="button" class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navigationBarNav" aria-controls="navigationBarNav" aria-expanded="false" aria-label="Alternar navegação">
          <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>
        <div id="navigationBarNav" class="collapse navbar-collapse">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a href="/" class="nav-link active" aria-current="page">
                <i class="bi bi-house" aria-hidden="true"></i> Início
              </a>
            </li>
            <li class="nav-item">
              <a href="/signup" class="nav-link">
                <i class="bi bi-person-plus" aria-hidden="true"></i> Criar conta
              </a>
            </li>
            <li class="nav-item">
              <a href="/login" class="nav-link">
                <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> Entrar
              </a>
            </li>
            <li class="nav-item">
              <a href="/developer" class="nav-link">
                <i class="bi bi-file-earmark-person" aria-hidden="true"></i> Sobre o desenvolvedor
              </a>
            </li>
            <li class="nav-item d-flex align-items-center">
              <div class="form-check form-switch mb-0 ms-lg-2">
                <input type="checkbox" id="themeToggleButton" class="form-check-input" role="switch">
                <label for="themeToggleButton" class="form-check-label text-body-secondary">
                  <i class="bi bi-moon" aria-hidden="true"></i> Modo escuro
                </label>
              </div>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>
  <main class="d-flex align-items-center flex-grow-1 py-5">
    <div class="container">
      <div class="row g-4 flex-column-reverse flex-xl-row align-items-xl-center">
        <div class="col-12 col-xl-7">
          <div class="text-center text-xl-start">
            <h1 class="display-4 fw-bold mb-3">Suas anotações sempre ao seu alcance</h1>
            <p class="lead text-body-secondary mb-3">Organize suas ideias e mantenha suas anotações acessíveis de qualquer lugar.</p>
            <div class="d-flex justify-content-center justify-content-xl-start flex-wrap gap-3">
              <a href="/signup" class="btn btn-primary btn-lg">
                <i class="bi bi-person-plus" aria-hidden="true"></i> Criar conta
              </a>
              <a href="/login" class="btn btn-outline-primary btn-lg">
                <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> Entrar
              </a>
            </div>
          </div>
        </div>
        <div class="col-12 col-xl-5">
          <div class="text-center hero-image-container">
            <img src="/assets/images/hero.svg" alt="Ilustração de uma mulher fazendo anotações" class="img-fluid" width="400" height="400">
          </div>
        </div>
      </div>
    </div>
  </main>
  <div id="warningModal" class="modal fade" role="dialog" tabindex="-1" aria-labelledby="warningModalLabel" aria-describedby="warningModalDescription" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="warningModalLabel" class="modal-title fs-5">
            <i class="bi bi-info-circle" aria-hidden="true"></i> Aviso
          </h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <p id="warningModalDescription" class="mb-0" aria-live="polite"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            <i class="bi bi-check-circle" aria-hidden="true"></i> Entendido
          </button>
        </div>
      </div>
    </div>
  </div>
  <footer class="bg-body-tertiary py-3 border-top">
    <div class="container">
      <p class="text-center text-body-secondary mb-0">
        Desenvolvido por <a href="https://www.github.com/vitorggsouza" class="text-decoration-none" target="_blank" rel="noopener noreferrer">Vitor Souza</a>
      </p>
    </div>
  </footer>
</body>
</html>
